<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weddings at Milagro — Pricing Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#F4EDE2;
    --bone-2:#EDE3D4;
    --ink:#2A1C12;
    --ink-soft:#6B5644;
    --rust:#BC4A26;
    --rust-deep:#9A3A1C;
    --clay:#D8A988;
    --olive:#3A3327;
    --line:#DBCDB9;
    --white:#FFFDF9;
    --danger:#B0563F;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Hanken Grotesk',sans-serif;
    background:var(--bone);
    color:var(--ink);
    font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:500;line-height:1.08;}
  img{display:block;max-width:100%;}
  a{color:inherit;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  .rule{height:1px;background:var(--line);border:0;}

  /* ── TOP UTILITY BAR ── */
  .util{ background:var(--olive); }
  .util-inner{
    max-width:1080px;margin:0 auto;padding:7px 28px;
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    font-size:.72rem;letter-spacing:.04em;color:#D8CDBE;
  }
  .util a{color:#D8CDBE;text-decoration:none;}
  .util a:hover{color:#fff;}
  .util .util-right{display:flex;gap:1.4rem;align-items:center;}
  @media(max-width:620px){.util .util-hide{display:none;}}

  /* ── NAV ── */
  nav.bar{
    position:sticky;top:0;z-index:50;
    background:rgba(244,237,226,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{
    max-width:1080px;margin:0 auto;padding:0 28px;height:68px;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
  }
  .bar-logos{display:flex;align-items:center;gap:.85rem;}
  .bar-logo{display:flex;align-items:center;text-decoration:none;}
  .bar-logo img{height:24px;width:auto;display:block;}
  .bar-logo.cse img{height:30px;}
  .bar-logo-div{width:1px;height:26px;background:var(--line);}
  .bar-right{display:flex;align-items:center;gap:.7rem;}
  .burger{
    display:flex;align-items:center;justify-content:center;
    width:42px;height:42px;border-radius:999px;border:1px solid var(--rust);
    background:var(--rust);color:var(--white);cursor:pointer;
    transition:background .2s;flex-shrink:0;
  }
  .burger:hover{background:var(--rust-deep);}
  .burger svg{width:18px;height:18px;}
  .bar-menu{
    display:none;position:absolute;top:68px;left:0;right:0;z-index:49;
    background:var(--white);border-bottom:1px solid var(--line);
    box-shadow:0 12px 36px rgba(42,28,18,.12);padding:1.2rem 0;
  }
  .bar-menu.open{display:block;}
  .bar-menu a{
    display:block;padding:.75rem 32px;
    font-size:.82rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;transition:color .15s,background .15s;
  }
  .bar-menu a:hover{color:var(--rust);background:var(--bone-2);}
  .btn{
    display:inline-block;font-family:'Hanken Grotesk',sans-serif;
    font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:.7rem 1.3rem;border-radius:999px;border:1px solid var(--rust);
    background:var(--rust);color:var(--white);text-decoration:none;cursor:pointer;
    transition:background .2s,transform .15s;
  }
  .btn:hover{background:var(--rust-deep);}
  .btn-ghost{background:transparent;color:var(--rust);}
  .btn-ghost:hover{background:var(--rust);color:var(--white);}

  /* ── HERO ── */
  .hero{
    position:relative;min-height:54vh;display:flex;align-items:center;
    background-color:var(--olive);
    background-image:linear-gradient(180deg,rgba(42,28,18,.6) 0%,rgba(42,28,18,.28) 42%,rgba(42,28,18,.12) 70%,rgba(42,28,18,.3) 100%);
    background-size:cover;background-position:center top;
  }
  .hero.noimg{
    background-image:linear-gradient(155deg,#48402F 0%,var(--olive) 45%,#241B12 100%);
  }
  .hero-inner{max-width:1100px;margin:0;padding:3.6rem clamp(24px,6vw,80px);width:100%;color:var(--white);}
  .hero h1{
    font-size:clamp(2.6rem,7vw,5rem);font-weight:400;color:#fff;
    letter-spacing:-.01em;text-shadow:0 2px 22px rgba(42,28,18,.45);
    display:flex;flex-wrap:wrap;align-items:center;gap:.04em .2em;
  }
  .hero h1 em{font-style:italic;}
  .hero-logo{height:1.72em;width:auto;display:inline-block;vertical-align:top;filter:drop-shadow(0 2px 14px rgba(42,28,18,.5));}
  .hero.noimg .hero-logo{filter:none;}
  .hero-sub{
    font-size:1.3rem;color:#F6EEE6;max-width:34ch;margin-top:1.1rem;font-weight:400;line-height:1.5;
    text-shadow:0 1px 14px rgba(42,28,18,.55);
  }
  .hero.noimg h1,.hero.noimg .hero-sub{text-shadow:none;}

  /* ── SECTION SCAFFOLD ── */
  section{padding:5rem 0;}
  .sec-head{max-width:62ch;}
  .sec-head h2{font-size:clamp(1.9rem,4vw,2.9rem);color:var(--ink);}
  .sec-head p{margin-top:1rem;color:var(--ink-soft);font-size:1.02rem;}
  .center{text-align:center;margin-left:auto;margin-right:auto;}

  /* ── INTRO ── */
  .intro{padding:4.5rem 0 3rem;text-align:center;}
  .intro h2{font-size:clamp(1.7rem,3.4vw,2.4rem);max-width:20ch;margin:0 auto;}
  .intro p{max-width:54ch;margin:1.1rem auto 0;color:var(--ink-soft);font-size:1.05rem;}
  .intro .tag{
    margin-top:1.6rem;display:inline-block;font-size:.8rem;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;background:var(--white);
  }

  /* ── MEET KYLEE ── */
  .guide-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:3rem;align-items:center;}
  .guide-photo{display:flex;justify-content:center;}
  .guide-photo .avatar{
    width:200px;height:200px;border-radius:50%;object-fit:cover;object-position:center top;
    border:4px solid var(--white);box-shadow:0 6px 24px rgba(42,28,18,.18);
    outline:1px solid var(--line);
  }
  .guide-photo .monogram{
    width:200px;height:200px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,var(--clay),#C28F6C);
    color:var(--white);font-family:'Fraunces',serif;font-size:5rem;font-weight:500;
    border:4px solid var(--white);box-shadow:0 6px 24px rgba(42,28,18,.18);
    outline:1px solid var(--line);
  }
  .guide-body h2{font-size:clamp(1.8rem,3.6vw,2.6rem);}
  .guide-role{color:var(--rust);font-weight:600;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;margin-top:.3rem;}
  .guide-body p{margin-top:1.1rem;color:var(--ink-soft);font-size:1.04rem;}
  .guide-sign{font-family:'Fraunces',serif;font-style:italic;font-size:1.4rem;color:var(--ink);margin-top:1.2rem;}
  @media(max-width:760px){.guide-grid{grid-template-columns:1fr;gap:1.6rem;text-align:center;}}

  /* ── STARTING SNAPSHOT ── */
  .snap{background:var(--bone-2);}
  .snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:2.4rem;}
  .snap-card{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:2.2rem 2rem;text-align:center;
  }
  .snap-card .season{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .snap-card .months{font-size:.8rem;color:var(--clay);margin-top:.2rem;font-weight:500;}
  .snap-card .startlabel{font-size:.8rem;color:var(--ink-soft);margin-top:1.1rem;font-style:italic;font-family:'Fraunces',serif;}
  .snap-card .price{font-family:'Fraunces',serif;font-size:3.6rem;font-weight:500;color:var(--rust);line-height:1;margin-top:.1rem;}
  .snap-card .price sup{font-size:1.4rem;vertical-align:super;top:-.2em;}
  .snap-range{
    text-align:center;margin-top:2rem;font-size:1rem;color:var(--ink-soft);max-width:52ch;margin-left:auto;margin-right:auto;
  }
  .snap-range b{color:var(--ink);font-weight:600;}
  @media(max-width:620px){.snap-grid{grid-template-columns:1fr;}}

  /* ── WHAT'S INCLUDED ── */
  .incl-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center;}
  .incl-grid.noimg{grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto;text-align:center;}
  .incl-grid.noimg .incl-list{text-align:left;}
  .incl-photo img{width:100%;border-radius:4px;}
  .incl-photo .cap{font-size:.74rem;color:var(--ink-soft);margin-top:.6rem;font-style:italic;font-family:'Fraunces',serif;}
  .incl-list{columns:2;column-gap:1.6rem;margin-top:.4rem;}
  .incl-list li{
    list-style:none;break-inside:avoid;font-size:.92rem;color:var(--ink);
    padding:.5rem 0 .5rem 1.5rem;position:relative;border-bottom:1px solid var(--line);
  }
  .incl-list li::before{content:'';position:absolute;left:0;top:.95rem;width:7px;height:7px;border-radius:50%;background:var(--rust);}
  @media(max-width:760px){.incl-grid{grid-template-columns:1fr;gap:1.6rem;}.incl-list{columns:1;}}

  .incl-dark{background:var(--olive);}
  .incl-dark h2{color:#fff;}
  .incl-dark .incl-list li{color:#EFE6D9;border-bottom-color:#564d3d;}
  .incl-dark .incl-list li::before{background:var(--clay);}
  .incl-dark .incl-photo .cap{color:#C9BCA9;}

  /* ── PRICING TABLES ── */
  .price-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:2.4rem;}
  .ptable{background:var(--white);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .ptable-head{padding:1.1rem 1.4rem;display:flex;justify-content:space-between;align-items:baseline;}
  .ptable-head.high{background:var(--rust);}
  .ptable-head.low{background:var(--olive);}
  .ptable-head .s{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;}
  .ptable-head .m{font-size:.72rem;color:#ffffffcc;}
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  thead th{font-family:'Hanken Grotesk',sans-serif;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:.7rem .6rem;text-align:right;border-bottom:1px solid var(--line);}
  thead th:first-child{text-align:left;padding-left:1.4rem;}
  tbody td{padding:.7rem .6rem;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);border-bottom:1px solid var(--bone-2);}
  tbody td:first-child{text-align:left;padding-left:1.4rem;font-weight:500;color:var(--ink-soft);}
  tbody tr:last-child td{border-bottom:0;}
  .ptable-foot{padding:.7rem 1.4rem 1rem;font-size:.74rem;color:var(--ink-soft);}
  @media(max-width:720px){.price-wrap{grid-template-columns:1fr;}}

  /* ── ADD-ONS ── */
  .addons{background:var(--bone-2);}
  .addon-list{margin-top:2rem;max-width:680px;margin-left:auto;margin-right:auto;}
  .addon-row{
    display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
    padding:1rem 0;border-bottom:1px solid var(--line);
  }
  .addon-row:last-child{border-bottom:0;}
  .addon-name{font-size:.92rem;color:var(--ink);font-weight:500;}
  .addon-name .sub{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:400;}
  .addons .wrap{max-width:720px;}
  .addon-price{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--rust);font-weight:500;white-space:nowrap;}
  .addon-or{text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);padding:.35rem 0;}

  /* ── WINE BAND ── */
  .grapeband{
    position:relative;text-align:center;color:#fff;padding:5.5rem 0;
    background-color:var(--ink);
    background-image:linear-gradient(180deg,rgba(34,22,14,.62),rgba(34,22,14,.66));
    background-size:cover;background-position:center;
  }
  .grapeband.noimg{
    background-image:linear-gradient(120deg,#3A2417 0%,var(--ink) 60%,#1F140C 100%);
  }
  .grapeband h2{color:#fff;font-size:clamp(1.8rem,4vw,2.8rem);max-width:20ch;margin-left:auto;margin-right:auto;text-shadow:0 2px 18px rgba(0,0,0,.45);}
  .grapeband p{color:#F6EEE6;max-width:50ch;margin:1rem auto 0;font-weight:400;text-shadow:0 1px 12px rgba(0,0,0,.5);}
  .grapeband.noimg h2,.grapeband.noimg p{text-shadow:none;}

  /* ── TYPICAL SPEND ── */
  .spend-section{background:var(--olive);color:#fff;padding:5rem 0;}
  .spend-section h2{color:#fff;}
  .spend-section .sec-head p{color:#D8CDBE;}

  /* ── SMALLER CELEBRATIONS (cards) ── */
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2.4rem;}
  .mini-card{background:var(--white);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}
  .mini-card .ph{height:150px;background-size:cover;background-position:center;}
  .mini-card .ph.noimg{height:8px;background:var(--rust);}
  .mini-card .bd{padding:1.4rem;flex:1;display:flex;flex-direction:column;}
  .mini-card h3{font-size:1.45rem;}
  .mini-card .p{font-family:'Fraunces',serif;font-size:2.1rem;color:var(--rust);font-weight:500;line-height:1;margin:.2rem 0 .1rem;}
  .mini-card .p sup{font-size:.9rem;vertical-align:super;}
  .mini-card .meta{font-size:.82rem;color:var(--ink-soft);margin-bottom:.8rem;}
  .mini-card .desc{font-size:.86rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:.8rem;margin-top:auto;}
  @media(max-width:760px){
    .mini-grid{grid-template-columns:1fr;}
    .mini-card{flex-direction:row;}
    .mini-card .ph{width:38%;height:auto;}
    .mini-card .ph.noimg{width:8px;height:auto;}
    .mini-card .bd{flex:1;}
  }

  /* ── TASTING ROOM strip ── */
  .tr{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;margin-top:3rem;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--white);}
  .tr.noimg{grid-template-columns:1fr;}
  .tr .ph{background-size:cover;background-position:center;min-height:280px;background-color:var(--bone-2);}
  .tr h3{font-size:1.7rem;}
  .tr .bd{padding:2.4rem;}
  .tr .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.2rem;}
  .tr .mi{border-top:1px solid var(--line);padding-top:.6rem;}
  .tr .mi .l{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .tr .mi .v{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--ink);}
  @media(max-width:720px){.tr{grid-template-columns:1fr;}}

  /* ── DUO SLIDER (Typical spend  ⇄  Micro weddings) ── */
  .duo{position:relative;padding:0;overflow:hidden;}
  .duo-track{
    display:flex;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
    height:auto;transition:height .35s ease;scrollbar-width:none;
  }
  .duo-track::-webkit-scrollbar{display:none;}
  .duo-slide{flex:0 0 100%;scroll-snap-align:start;align-self:flex-start;}
  .duo-slide>.wrap{padding-top:5rem;padding-bottom:5.5rem;}
  .duo-slide.spend{background:var(--olive);color:var(--bone);}
  .duo-slide.micro-slide{background:var(--bone);}

  .duo-hint{
    position:absolute;top:18px;right:18px;z-index:6;
    display:inline-flex;align-items:center;gap:.45rem;
    background:var(--rust);color:#fff;font-size:.64rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:.45rem .9rem;border-radius:999px;box-shadow:0 4px 14px rgba(42,28,18,.25);
    animation:nudge 1.8s ease-in-out infinite;transition:opacity .3s;
  }
  .duo-hint svg{width:13px;height:13px;}
  .duo-hint.gone{opacity:0;pointer-events:none;}
  @keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}

  .duo-arrow{
    position:absolute;top:46%;z-index:5;width:46px;height:46px;border-radius:50%;
    border:none;cursor:pointer;background:var(--white);color:var(--rust);
    box-shadow:0 4px 16px rgba(42,28,18,.22);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .25s,transform .15s;
  }
  .duo-arrow svg{width:20px;height:20px;}
  .duo-arrow:hover{transform:scale(1.07);}
  .duo-arrow.prev{left:16px;}
  .duo-arrow.next{right:16px;}
  .duo-arrow[hidden]{display:none;}

  .duo-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:.5rem;}
  .duo-dots .dot{width:9px;height:9px;border-radius:50%;border:none;padding:0;cursor:pointer;background:#C9BCA9;opacity:.55;transition:.2s;}
  .duo-dots .dot.active{background:var(--rust);opacity:1;transform:scale(1.2);}
  @media(prefers-reduced-motion:reduce){.duo-hint{animation:none;}.duo-track{scroll-behavior:auto;transition:none;}}
  @media(max-width:560px){.duo-arrow{width:40px;height:40px;}.duo-arrow.prev{left:8px;}.duo-arrow.next{right:8px;}}

  /* spend slide internals */
  .spend h2{color:#fff;}
  .spend .sec-head p{color:#D8CDBE;}
  .spend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2.6rem;}
  .spend-card{border:1px solid #564d3d;border-radius:6px;padding:1.8rem;background:#43392b;}
  .spend-card .t{font-family:'Fraunces',serif;font-size:1.4rem;color:#fff;}
  .spend-card .g{font-size:.78rem;color:var(--clay);letter-spacing:.04em;margin-top:.1rem;}
  .spend-card .r{font-family:'Fraunces',serif;font-size:2rem;color:#fff;margin-top:1rem;line-height:1;}
  .spend-card .r span{font-size:.9rem;color:#D8CDBE;}
  .spend-card .d{font-size:.84rem;color:#D8CDBE;margin-top:.8rem;border-top:1px solid #564d3d;padding-top:.8rem;}
  .spend-note{text-align:center;margin-top:2rem;font-size:.86rem;color:#C9BCA9;max-width:60ch;margin-left:auto;margin-right:auto;font-style:italic;font-family:'Fraunces',serif;}
  @media(max-width:760px){.spend-grid{grid-template-columns:1fr;}}

  /* ── CTA ── */
  .cta{
    position:relative;text-align:center;color:#fff;padding:6rem 0;
    background-color:var(--ink);
    background-image:linear-gradient(180deg,rgba(42,28,18,.55),rgba(42,28,18,.78));
    background-size:cover;background-position:center;
  }
  .cta.noimg{
    background-image:linear-gradient(150deg,var(--rust-deep) 0%,#5E2614 55%,var(--ink) 100%);
  }
  .cta h2{color:#fff;font-size:clamp(2rem,5vw,3.4rem);max-width:18ch;margin-left:auto;margin-right:auto;}
  .cta p{color:#F3E9DF;max-width:46ch;margin:1rem auto 2rem;font-weight:300;}
  .cta-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .cta .btn-ghost{color:#fff;border-color:#fff;}
  .cta .btn-ghost:hover{background:#fff;color:var(--ink);}

  /* ── FINE PRINT ── */
  .terms{padding:4.5rem 0;background:var(--olive,#3A3430);color:#E8E0D6;}
  .terms .sec-head h2{font-size:2.2rem;color:#fff;letter-spacing:.04em;text-transform:uppercase;}
  .terms .sec-head p{color:#C4B8AA;}
  .terms-disclaimer{display:flex;align-items:center;gap:.7rem;justify-content:center;margin-bottom:2.4rem;padding:1rem 1.8rem;margin-top:1rem;border:1px solid rgba(255,255,255,.15);border-radius:4px;background:rgba(255,255,255,.06);max-width:fit-content;margin-left:auto;margin-right:auto;}
  .terms-disclaimer svg{flex-shrink:0;opacity:.7;}
  .terms-disclaimer span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);}
  .terms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;margin-top:.5rem;}
  .term{border-left:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);border-radius:0 4px 4px 0;padding:1.1rem 1.3rem;}
  .term .l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;}
  .term p{font-size:.9rem;color:rgba(255,255,255,.55);margin-top:.3rem;}
  .terms-note{text-align:center;margin-top:2rem;font-size:.82rem;color:rgba(255,255,255,.4);}
  @media(max-width:620px){.terms-grid{grid-template-columns:1fr;}}

  /* ── FOOTER ── */
  footer{background:var(--olive);color:#D8CDBE;padding:4rem 0 2.5rem;text-align:center;}
  footer .flogo{height:32px;width:auto;margin:0 auto 1.4rem;}
  footer .fcontact{font-size:.95rem;line-height:1.9;}
  footer .fcontact a{color:#F3E9DF;text-decoration:none;}
  footer .fcontact a:hover{text-decoration:underline;}
  footer .fdiv{width:40px;height:1px;background:#564d3d;margin:1.6rem auto;}
  footer .managed{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#9d9483;margin-bottom:.9rem;}
  footer .cselogo{height:48px;width:auto;margin:0 auto;opacity:.95;}
  .guide-btn{margin-top:1.5rem;display:inline-block;}
  footer .csewordmark{font-family:'Fraunces',serif;font-size:1.15rem;color:#C9BCA9;}
  footer .sub{font-size:.68rem;color:#7d735f;margin-top:1.1rem;letter-spacing:.04em;}

  .staff-access{position:fixed;right:10px;bottom:8px;z-index:60;font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:#B7A88F;text-decoration:none;opacity:.55;transition:opacity .2s,color .2s;}
  .staff-access:hover{opacity:1;color:var(--rust);}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
  .reveal.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}

  /* ── LOGIN ── */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bone);}
  .login-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:2.6rem 2.4rem;max-width:400px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(42,28,18,.08);}
  .lock{width:54px;height:54px;border-radius:50%;background:var(--bone-2);display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;color:var(--rust);}
  .login-card h1{font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;}
  .login-card .sub{color:var(--ink-soft);font-size:.92rem;margin-top:.4rem;}
  .login-err{color:var(--danger);font-size:.82rem;margin-top:.9rem;min-height:1.2em;}

  /* ── ADMIN ── */
  .admin{max-width:900px;margin:0 auto;padding:2.4rem 24px 6rem;}
  .img-preview{display:block;max-width:260px;max-height:140px;margin-top:8px;border-radius:4px;border:1px solid var(--line);object-fit:cover;}
  .img-preview.empty{width:260px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--line);color:#999;font-size:.75rem;letter-spacing:.1em;}
  .admin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding-bottom:1.4rem;border-bottom:1px solid var(--line);margin-bottom:1.6rem;}
  .admin-head h1{font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;}
  .admin-head .sub{color:var(--ink-soft);font-size:.88rem;margin-top:.15rem;}
  .sec-label{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink);margin:2.2rem 0 .9rem;padding-top:.6rem;border-top:2px solid var(--bone-2);}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:1.3rem;margin-bottom:.9rem;}
  .field{margin-bottom:.9rem;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.03em;margin-bottom:.35rem;color:var(--ink);}
  .field input,.field textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;font-family:'Hanken Grotesk',sans-serif;font-size:.92rem;color:var(--ink);background:var(--white);resize:vertical;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(188,74,38,.13);}
  .field .hint{font-size:.68rem;color:var(--ink-soft);margin-top:.3rem;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;}
  @media(max-width:680px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}
  .item-card{background:var(--bone);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.7rem;}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
  .item-head .t{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.4rem;}
  button.ui{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1rem;border:none;border-radius:8px;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.03em;transition:background .2s;}
  button.ui.primary{background:var(--rust);color:#fff;}
  button.ui.primary:hover{background:var(--rust-deep);}
  button.ui.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line);}
  button.ui.ghost:hover{background:var(--bone-2);}
  button.ui.danger{background:var(--white);color:var(--danger);border:1px solid #E4C9C0;}
  button.ui.danger:hover{background:#FBEDE9;}
  button.ui:disabled{opacity:.55;cursor:not-allowed;}
  .savebar{position:sticky;bottom:0;background:rgba(244,237,226,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:1rem 24px;margin:2rem -24px -6rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
  .savebar .hint{font-size:.74rem;color:var(--ink-soft);}
  .admin-foot{text-align:center;margin-top:2rem;}
  .admin-foot a{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#B7A88F;text-decoration:none;}
  .admin-foot a:hover{color:var(--rust);}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:.7rem 1.3rem;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:.3s;z-index:200;box-shadow:0 8px 24px rgba(42,28,18,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .config-warn{background:#FBEDE9;border:1px solid #E4C9C0;color:var(--rust-deep);border-radius:10px;padding:1rem 1.2rem;font-size:.86rem;margin:1.5rem auto;max-width:640px;}
  .config-warn code{background:#fff;padding:.1rem .35rem;border-radius:4px;font-size:.82em;}

  /* ── SCHEDULE MODAL ── */
  .sched-overlay{
    position:fixed;inset:0;background:rgba(42,28,18,.55);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:500;padding:20px;
  }
  .sched-overlay.open{display:flex;}
  .sched-modal{
    background:var(--bone);border:1px solid var(--line);border-radius:10px;
    max-width:440px;width:100%;padding:2.2rem 1.9rem 1.9rem;position:relative;
    box-shadow:0 24px 60px rgba(42,28,18,.28);
  }
  .sched-modal h3{font-size:1.25rem;margin-bottom:1.5rem;line-height:1.35;padding-right:1.4rem;}
  .sched-close{
    position:absolute;top:.9rem;right:1rem;background:none;border:none;cursor:pointer;
    color:var(--ink-soft);font-size:1.5rem;line-height:1;padding:.2rem;font-family:inherit;
  }
  .sched-close:hover{color:var(--ink);}
  .sched-actions{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1.7rem;}
  .sched-actions .btn{width:100%;text-align:center;}
  .sched-actions .btn.disabled{
    background:var(--line);border-color:var(--line);color:var(--ink-soft);
    cursor:not-allowed;pointer-events:none;opacity:.8;
  }
  .sched-footer{border-top:1px solid var(--line);padding-top:1.2rem;text-align:center;font-size:.85rem;color:var(--ink-soft);}
  .sched-footer .sched-terms-btn{
    margin-top:.45rem;background:none;border:none;color:var(--rust);text-decoration:underline;
    cursor:pointer;font-size:.85rem;font-family:inherit;padding:0;
  }
  .sched-footer .sched-terms-btn:hover{color:var(--rust-deep);}
</style>
</head>

  <div class="sched-modal">
    <button class="sched-close" type="button" aria-label="Close" onclick="closeScheduleModal()">&times;</button>
    <h3>What kind of event are you looking for, wedding or private event?</h3>

  </div>
</div>

const app = document.getElementById('app');
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
function toast(msg, dur=2400){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), dur);
}
const configured = () => BIN_ID && API_KEY && !BIN_ID.includes('PASTE') && !API_KEY.includes('PASTE');

/* ---------- DATA ---------- */
let DATA = null;
let authed = false;
let currentView = null;

async function load(force){
  if(DATA && !force) return;                 // fetch once, then reuse cached copy
  if(!configured()){ DATA = JSON.parse(JSON.stringify(DEFAULT_DATA)); return; }
  const res = await fetch(READ_URL, { headers:{ 'X-Master-Key': API_KEY } });
  if(!res.ok){
    let detail = '';
    try { detail = (await res.text()).slice(0,160); } catch(_){}
    const hint = res.status===429 ? ' — JSONBin rate limit hit; wait ~30 seconds and reload'
              : res.status===401||res.status===403 ? ' — key not accepted for this bin'
              : res.status===404 ? ' — bin ID not found' : '';
    throw new Error('JSONBin returned ' + res.status + hint + (detail?(' · '+detail):''));
  }
  const json = await res.json();
  DATA = json.record;
}
async function save(){
  if(!configured()) throw new Error('Not connected to JSONBin yet — add your Bin ID and key.');
  const res = await fetch(WRITE_URL, {
    method: 'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(DATA)
  });
  if(!res.ok) throw new Error('Failed to save: ' + res.status);
}

/* ---------- ROUTER ---------- */
async function route(){
  const isAdmin = location.hash.replace('#','').toLowerCase()==='admin';
  if(!DATA){                                  // only fetch when we have nothing cached
    try {
      app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="font-family:'Fraunces',serif;font-size:1.4rem;color:var(--ink-soft);">Loading…</div></div>`;
      currentView = null;
      await load();
    } catch(e){
      showError(e.message); return;
    }
  }
  if(isAdmin){
    authed ? renderAdmin() : renderLogin();
    currentView = 'admin';
  } else {
    if(currentView !== 'public'){             // don't re-render on in-page anchor clicks
      try { renderPublic(); }
      catch(e){ showError('Page error: ' + e.message); return; }
      currentView = 'public';
    }
  }
}
function showError(msg){
  currentView = null;
  app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;"><div><div style="font-family:'Fraunces',serif;font-size:1.4rem;color:var(--ink-soft);margin-bottom:.5rem;">Unable to load</div><div style="font-size:.85rem;color:var(--ink-soft);max-width:42ch;">${esc(msg)}</div></div></div>`;
}
window.addEventListener('hashchange', route);

function openScheduleModal(){
  const ov = document.getElementById('scheduleOverlay');
  if(!ov) return;
  ov.classList.add('open');
  ov.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function closeScheduleModal(){
  const ov = document.getElementById('scheduleOverlay');
  if(!ov) return;
  ov.classList.remove('open');
  ov.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}
function goToVenueTerms(){
  closeScheduleModal();
  const el = document.getElementById('venue-terms');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function configureScheduleModal(weddingUrl, privateUrl){
  const wBtn = document.getElementById('scheduleWeddingBtn');
  const pBtn = document.getElementById('schedulePrivateBtn');
  if(wBtn){
    wBtn.href = weddingUrl || '#';
  }
  if(pBtn){
    pBtn.dataset.privateUrl = privateUrl || '';
    if(privateUrl){
      pBtn.href = privateUrl;
      pBtn.textContent = 'Private Event';
      pBtn.classList.remove('disabled');
      pBtn.removeAttribute('aria-disabled');
      pBtn.removeAttribute('tabindex');
    } else {
      pBtn.removeAttribute('href');
      pBtn.textContent = '(Coming Soon)';
      pBtn.classList.add('disabled');
      pBtn.setAttribute('aria-disabled','true');
      pBtn.setAttribute('tabindex','-1');
    }
  }
}
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeScheduleModal(); });

function imgPreview(el){
  let p=el.parentElement.querySelector('.img-preview');
  if(!p){p=document.createElement('img');p.className='img-preview';el.parentElement.appendChild(p);}
  if(el.value){p.tagName==='DIV'?el.parentElement.replaceChild(Object.assign(document.createElement('img'),{className:'img-preview',src:el.value,alt:'preview'}),p):(p.src=el.value);}
  else{if(p.tagName==='IMG'){const d=document.createElement('div');d.className='img-preview empty';d.textContent='No image';el.parentElement.replaceChild(d,p);}}
}

/* ----- list renderers (admin) ----- */
function listCard(title, inner, removeKey, idx){
  return `<div class="item-card">
    <div class="item-head"><div class="t">${title} ${idx+1}</div>
      <button class="ui danger" data-del="${removeKey}" data-i="${idx}">Remove</button></div>
    ${inner}</div>`;
}
function wireDeletes(wrap){
  $$('[data-del]', wrap).forEach(b => b.onclick = () => delItem(b.dataset.del, +b.dataset.i));
}
function renderSnapCards(){
  const w=$('#sn-cards'); w.innerHTML = DATA.snapshot.cards.map((s,i)=>listCard('Season card',
    `<div class="grid2">${tf(`snc-season-${i}`,'Season',s.season)}${tf(`snc-months-${i}`,'Months',s.months)}</div>
     <div class="grid2">${tf(`snc-start-${i}`,'"starting at" label',s.startlabel)}${tf(`snc-price-${i}`,'Price (no $)',s.price)}</div>`,
    'snapcard',i)).join('');
  wireDeletes(w);
}
function renderIncItems(){
  const w=$('#inc-items'); w.innerHTML = DATA.included.items.map((it,i)=>
    `<div class="item-card"><div class="item-head"><div class="t">Item ${i+1}</div><button class="ui danger" data-del="incitem" data-i="${i}">Remove</button></div>${tf(`inc-item-${i}`,'',it)}</div>`).join('');
  wireDeletes(w);
}
function renderRows(wrapId, key, rows){
  const w=$('#'+wrapId); w.innerHTML = rows.map((r,i)=>listCard('Row',
    `<div class="grid4">${r.map((cell,j)=>tf(`${key}-${i}-${j}`, j===0?'Day':`Col ${j+1}`, cell)).join('')}</div>`,
    key,i)).join('');
  wireDeletes(w);
}
function renderAddons(){
  const w=$('#ad-rows'); w.innerHTML = DATA.addons.rows.map((a,i)=>listCard('Add-on',
    `${tf(`adn-name-${i}`,'Name',a.name)}${tf(`adn-sub-${i}`,'Subtitle',a.sub)}${tf(`adn-price-${i}`,'Price',a.price)}`,
    'addon',i)).join('');
  wireDeletes(w);
}
function renderMicroCards(){
  const w=$('#mc-cards'); w.innerHTML = DATA.micro.cards.map((m,i)=>listCard('Card',
    `<div class="grid2">${tf(`mcc-title-${i}`,'Title',m.title)}${tf(`mcc-price-${i}`,'Price (no $)',m.price)}</div>
     ${tf(`mcc-meta-${i}`,'Meta line',m.meta)}${ta2(`mcc-desc-${i}`,'Description',m.desc)}${imgf(`mcc-image-${i}`,'Photo',m.image)}`,
    'microcard',i)).join('');
  wireDeletes(w);
}
function renderTrMeta(){
  const w=$('#tr-meta'); w.innerHTML = DATA.micro.tasting.meta.map((mi,i)=>
    `<div class="item-card"><div class="item-head"><div class="t">Detail ${i+1}</div><button class="ui danger" data-del="trmeta" data-i="${i}">Remove</button></div><div class="grid2">${tf(`trm-l-${i}`,'Label',mi.l)}${tf(`trm-v-${i}`,'Value',mi.v)}</div></div>`).join('');
  wireDeletes(w);
}
function renderSpendCards(){
  const w=$('#sp-cards'); w.innerHTML = DATA.spend.cards.map((s,i)=>listCard('Tier',
    `<div class="grid2">${tf(`spc-t-${i}`,'Title',s.t)}${tf(`spc-g-${i}`,'Guest line',s.g)}</div>
     ${tf(`spc-r-${i}`,'Range (no $)',s.r)}${ta2(`spc-d-${i}`,'Description',s.d)}`,
    'spendcard',i)).join('');
  wireDeletes(w);
}
function renderTerms(){
  const w=$('#tm-items'); w.innerHTML = DATA.terms.items.map((t,i)=>listCard('Term',
    `${tf(`tmi-l-${i}`,'Label',t.l)}${ta2(`tmi-body-${i}`,'Text',t.body)}`,
    'term',i)).join('');
  wireDeletes(w);
}

/* ----- add / delete (preserve unsaved edits first) ----- */
function addItem(kind){
  gather();
  const d=DATA;
  if(kind==='snapcard') d.snapshot.cards.push({season:'New Season',months:'',startlabel:'starting at',price:'0'});
  if(kind==='incitem') d.included.items.push('New item');
  if(kind==='highrow') d.pricing.high.rows.push(['Day','$0','$0','$0']);
  if(kind==='lowrow') d.pricing.low.rows.push(['Day','$0','$0','$0']);
  if(kind==='addon') d.addons.rows.push({name:'New add-on',sub:'',price:'$0'});
  if(kind==='microcard') d.micro.cards.push({title:'New Package',price:'0',meta:'',desc:'',image:''});
  if(kind==='trmeta') d.micro.tasting.meta.push({l:'Label',v:'Value'});
  if(kind==='spendcard') d.spend.cards.push({t:'New Tier',g:'',r:'0',d:''});
  if(kind==='term') d.terms.items.push({l:'Label',body:''});
  renderAdmin();
}
function delItem(kind, i){
  if(!confirm('Delete this item? This can\'t be undone until you reload without saving.')) return;
  gather();
  const d=DATA;
  const map={ snapcard:d.snapshot.cards, incitem:d.included.items, highrow:d.pricing.high.rows,
    lowrow:d.pricing.low.rows, addon:d.addons.rows, microcard:d.micro.cards,
    trmeta:d.micro.tasting.meta, spendcard:d.spend.cards, term:d.terms.items };
  map[kind].splice(i,1);
  renderAdmin();
}

/* ----- gather all inputs into DATA ----- */
function gather(){
  const d=DATA;
  d.contact.location=val('c-location'); d.contact.phone=val('c-phone'); d.contact.phoneHref=val('c-phoneHref'); d.contact.email=val('c-email'); d.contact.address=val('c-address');
  d.hero.headPre=val('h-pre'); d.hero.headPost=val('h-post'); d.hero.sub=val('h-sub'); d.hero.image=val('h-image');
  d.intro.heading=val('i-heading'); d.intro.body=val('i-body'); d.intro.tag=val('i-tag');
  d.guide.name=val('g-name'); d.guide.initial=val('g-initial'); d.guide.role=val('g-role'); d.guide.bio=val('g-bio'); d.guide.sign=val('g-sign'); d.guide.btn=val('g-btn'); d.guide.photo=val('g-photo');
  d.snapshot.heading=val('sn-heading'); d.snapshot.body=val('sn-body'); d.snapshot.range=val('sn-range');
  d.snapshot.cards.forEach((s,i)=>{ s.season=val(`snc-season-${i}`); s.months=val(`snc-months-${i}`); s.startlabel=val(`snc-start-${i}`); s.price=val(`snc-price-${i}`); });
  d.included.heading=val('inc-heading'); d.included.caption=val('inc-caption'); d.included.photo=val('inc-photo');
  d.included.items=d.included.items.map((_,i)=>val(`inc-item-${i}`));
  d.pricing.heading=val('pr-heading'); d.pricing.body=val('pr-body'); d.pricing.foot=val('pr-foot');
  d.pricing.columns=[val('pr-col0'),val('pr-col1'),val('pr-col2'),val('pr-col3')];
  d.pricing.high.label=val('pr-high-label'); d.pricing.high.months=val('pr-high-months');
  d.pricing.high.rows=d.pricing.high.rows.map((r,i)=>r.map((_,j)=>val(`highrow-${i}-${j}`)));
  d.pricing.low.label=val('pr-low-label'); d.pricing.low.months=val('pr-low-months');
  d.pricing.low.rows=d.pricing.low.rows.map((r,i)=>r.map((_,j)=>val(`lowrow-${i}-${j}`)));
  d.addons.heading=val('ad-heading'); d.addons.body=val('ad-body');
  d.addons.rows.forEach((a,i)=>{ a.name=val(`adn-name-${i}`); a.sub=val(`adn-sub-${i}`); a.price=val(`adn-price-${i}`); });
  d.grapeband.heading=val('gb-heading'); d.grapeband.body=val('gb-body'); d.grapeband.image=val('gb-image');
  d.micro.heading=val('mc-heading'); d.micro.body=val('mc-body');
  d.micro.cards.forEach((m,i)=>{ m.title=val(`mcc-title-${i}`); m.price=val(`mcc-price-${i}`); m.meta=val(`mcc-meta-${i}`); m.desc=val(`mcc-desc-${i}`); m.image=val(`mcc-image-${i}`); });
  d.micro.tasting.heading=val('tr-heading'); d.micro.tasting.body=val('tr-body'); d.micro.tasting.image=val('tr-image');
  d.micro.tasting.meta.forEach((mi,i)=>{ mi.l=val(`trm-l-${i}`); mi.v=val(`trm-v-${i}`); });
  d.spend.heading=val('sp-heading'); d.spend.body=val('sp-body'); d.spend.note=val('sp-note');
  d.spend.cards.forEach((s,i)=>{ s.t=val(`spc-t-${i}`); s.g=val(`spc-g-${i}`); s.r=val(`spc-r-${i}`); s.d=val(`spc-d-${i}`); });
  d.cta.heading=val('ct-heading'); d.cta.body=val('ct-body'); d.cta.btnPrimary=val('ct-btnP'); d.cta.btnSecondary=val('ct-btnS'); d.cta.image=val('ct-image'); d.cta.bookingWedding=val('ct-bookwed'); d.cta.bookingPrivate=val('ct-bookpvt');
  d.terms.heading=val('tm-heading'); d.terms.note=val('tm-note');
  d.terms.items.forEach((t,i)=>{ t.l=val(`tmi-l-${i}`); t.body=val(`tmi-body-${i}`); });
  d.footer.managed=val('ft-managed'); d.footer.copyright=val('ft-copyright');
  d.brand.cseUrl=val('br-cseUrl');
  const np=val('pass-new').trim(); if(np){ if(np.length<4){ throw new Error('Passcode must be at least 4 characters.'); } d.passcode=np; }
}

async function saveAll(){
  const btn=$('#save-all');
  if(!confirm('Save all changes? This will update the live page immediately.')) return;
  try { gather(); } catch(e){ toast(e.message); return; }
  btn.disabled=true; btn.textContent='Saving…';
  try { await save(); toast('✓ Saved — the live page is updated'); }
  catch(e){ toast('Error: '+e.message); }
  btn.disabled=false; btn.textContent='Save all changes';
}

route();
